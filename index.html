<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вишлист</title>
<meta name="description" content="Список идей для подарков.">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<style>
/* ============================================================
   Вишлист — оформление. Тёмная тема включается сама по системе.
   ============================================================ */

:root {
  color-scheme: light dark;
  --bg: #F5F5F7;
  --card: #FFFFFF;
  --card-2: #F0F0F3;
  --sep: rgba(0, 0, 0, .10);
  --text: #1D1D1F;
  --text-2: #5C5C61;
  --text-3: #6E6E73;
  --accent: #0071E3;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(0, 113, 227, .10);
  --fill: #1D1D1F;
  --fill-ink: #FFFFFF;
  --star: #C68A22;
  --star-off: rgba(0, 0, 0, .16);
  --shadow-hover: 0 4px 16px rgba(0, 0, 0, .08);
  --shadow-pop: 0 20px 60px rgba(0, 0, 0, .22), 0 2px 8px rgba(0, 0, 0, .08);
  --scrim: rgba(0, 0, 0, .40);
  --glass: rgba(28, 28, 30, .88);
  --danger: #D93B30;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.32, .72, 0, 1);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1C1C1E;
    --card-2: #2C2C2E;
    --sep: rgba(255, 255, 255, .14);
    --text: #F5F5F7;
    --text-2: #A1A1A6;
    --text-3: #8E8E93;
    --accent: #2997FF;
    --accent-ink: #00204A;
    --accent-soft: rgba(41, 151, 255, .16);
    --fill: #F5F5F7;
    --fill-ink: #1D1D1F;
    --star: #EFB350;
    --star-off: rgba(255, 255, 255, .22);
    --shadow-hover: 0 4px 18px rgba(0, 0, 0, .6);
    --shadow-pop: 0 24px 64px rgba(0, 0, 0, .8);
    --scrim: rgba(0, 0, 0, .60);
    --glass: rgba(58, 58, 60, .88);
    --danger: #FF6B5E;
  }
}

/* ---------- Основа ---------- */

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
}
body.is-locked { overflow: hidden; }
img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 1160px;
  margin: 0 auto;
  padding: 0 max(16px, var(--safe-r)) calc(48px + var(--safe-b)) max(16px, var(--safe-l));
}
@media (min-width: 760px) {
  .wrap { padding-left: max(40px, var(--safe-l)); padding-right: max(40px, var(--safe-r)); }
}

/* ---------- Шапка и порядок ---------- */

.top { padding: calc(var(--safe-t) + 40px) 0 0; }
.top__title {
  margin: 0;
  font-size: clamp(32px, 8vw, 44px);
  line-height: 1.07;
  font-weight: 700;
  letter-spacing: -0.022em;
}

.sort { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.chip {
  min-height: 40px;
  padding: 0 16px;
  border: 0;
  border-radius: 999px;
  background: var(--card);
  color: var(--text-2);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background .2s var(--ease), color .2s var(--ease);
}
.chip[aria-pressed="true"] { background: var(--fill); color: var(--fill-ink); }

/* ---------- Сетка карточек ---------- */

.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding-top: 20px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; } }

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  width: 100%;
  padding: 12px 12px 16px;
  border: 0;
  border-radius: 18px;
  background: var(--card);
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform .3s var(--ease), box-shadow .2s var(--ease);
}
.card:active { transform: scale(.97); transition-duration: .12s; }
@media (hover: hover) { .card:hover { box-shadow: var(--shadow-hover); } }

.card__photo {
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: 12px;
  overflow: hidden;
  background: var(--card-2);
}
.card__photo img { width: 100%; height: 100%; object-fit: cover; }

.card__title {
  display: -webkit-box;
  margin-top: 14px;
  font-size: 18px;
  line-height: 1.25;
  font-weight: 600;
  letter-spacing: -0.014em;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.price:empty { display: none; }
.price__main { font-size: 16px; font-weight: 600; }
.price__alt { font-size: 14px; color: var(--text-3); }

.stars { display: inline-flex; gap: 2px; margin-top: 8px; }
.stars svg { width: 14px; height: 14px; display: block; }

.badge {
  position: absolute;
  top: 22px; left: 22px;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px 6px 9px;
  border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  color: #FFFFFF;
  font-size: 12.5px;
  font-weight: 600;
}
.card.is-taken { opacity: .55; }
.card.is-taken .card__photo img { filter: grayscale(1); }

.empty { padding: 72px 0; text-align: center; color: var(--text-3); font-size: 17px; }

/* ---------- Панель поверх страницы ---------- */

.scrim {
  position: fixed; inset: 0; z-index: 60;
  background: var(--scrim);
  opacity: 0;
  transition: opacity .2s var(--ease);
}
.scrim.is-open { opacity: 1; }

.sheet {
  position: fixed;
  z-index: 61;
  left: 0; right: 0; bottom: 0;
  max-height: calc(100% - max(24px, var(--safe-t)));
  display: flex;
  flex-direction: column;
  background: var(--card);
  border-radius: 22px 22px 0 0;
  box-shadow: var(--shadow-pop);
  overflow: hidden;
  transform: translateY(100%);
  transition: transform .32s var(--ease);
}
.sheet.is-open { transform: translateY(0); }

@media (min-width: 760px) {
  .sheet {
    left: 50%; right: auto; top: 50%; bottom: auto;
    width: min(560px, calc(100vw - 64px));
    max-height: calc(100% - 64px);
    border-radius: 22px;
    opacity: 0;
    transform: translate(-50%, -46%) scale(.97);
    transition: transform .26s var(--ease), opacity .19s var(--ease);
  }
  .sheet.is-open { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

.sheet__scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

.sheet__close {
  position: absolute; top: 14px; right: 14px; z-index: 5;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border: 0; border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  color: #FFFFFF;
  cursor: pointer;
}
.sheet__close::after { content: ""; position: absolute; inset: -6px; }

.detail__photo { aspect-ratio: 4 / 3; background: var(--card-2); }
.detail__photo:empty { aspect-ratio: auto; height: 64px; background: none; }
.detail__photo img { width: 100%; height: 100%; object-fit: cover; }

.detail__body { padding: 22px 20px calc(28px + var(--safe-b)); }
@media (min-width: 760px) { .detail__body { padding: 24px 28px 30px; } }

.detail__title {
  margin: 0;
  font-size: clamp(24px, 6vw, 30px);
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.detail__body .price { margin-top: 10px; }
.detail__body .price__main { font-size: 20px; }
.detail__body .price__alt { font-size: 16px; }
.detail__body .stars { margin-top: 10px; }
.detail__body .stars svg { width: 17px; height: 17px; }

.actions { display: grid; gap: 10px; margin-top: 26px; }

/* ---------- Кнопки ---------- */

.btn {
  min-height: 50px;
  padding: 0 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 999px;
  background: var(--card-2);
  color: var(--text);
  font-size: 16px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: transform .12s var(--ease), opacity .2s var(--ease);
}
.btn:active { transform: scale(.98); }
@media (hover: hover) { .btn:hover { opacity: .85; } }
.btn--main { background: var(--accent); color: var(--accent-ink); }
.btn--soft { background: var(--accent-soft); color: var(--accent); }
.btn--quiet { background: none; color: var(--text-2); font-weight: 500; min-height: 44px; }

.taken {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px;
  padding: 0 16px;
  border-radius: 999px;
  background: var(--card-2);
  color: var(--text-2);
  font-size: 15px;
  font-weight: 500;
}

/* ---------- Сообщение ---------- */

.toast {
  position: fixed; left: 50%; bottom: calc(28px + var(--safe-b)); z-index: 90;
  max-width: calc(100vw - 32px);
  padding: 12px 20px;
  border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  color: #FFFFFF;
  font-size: 15px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 20px);
  transition: opacity .19s var(--ease), transform .19s var(--ease);
}
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .001ms !important; animation-duration: .001ms !important; }
}

/* ---------- Режим правки ---------- */

.editbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin-top: 16px; padding: 12px;
  border-radius: 18px; background: var(--card);
}
.editbar .btn { min-height: 44px; }
.editbar__rate { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-2); }
.editbar__rate .input { width: 90px; min-height: 44px; padding: 8px 12px; }
.editbar__exit { margin-left: auto; }

.status { padding: 64px 0; text-align: center; color: var(--text-3); font-size: 17px; }

.field { display: grid; gap: 6px; }
.field__label { font-size: 13px; font-weight: 500; color: var(--text-2); }
.input {
  width: 100%; min-height: 46px; padding: 10px 14px;
  border: 1px solid var(--sep); border-radius: 12px;
  background: var(--bg); color: var(--text); font: inherit; font-size: 16px;
}
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.form__head {
  flex: 0 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 6px 8px; border-bottom: 1px solid var(--sep);
}
.form__head .btn { justify-self: start; padding: 0 12px; }
.form__head .form__done { justify-self: end; color: var(--accent); font-weight: 600; }
.form__title { margin: 0; font-size: 17px; font-weight: 600; }
.form__body { padding: 18px 20px calc(28px + var(--safe-b)); display: grid; gap: 16px; }

.photo-pick {
  position: relative; width: 100%; aspect-ratio: 4 / 3;
  display: grid; place-items: center; padding: 0;
  border: 1.5px dashed var(--sep); border-radius: 14px;
  background: var(--bg); color: var(--accent);
  font-size: 16px; font-weight: 600; overflow: hidden; cursor: pointer;
}
.photo-pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo-pick.has-photo { border-style: solid; }
.photo-pick.has-photo span {
  position: absolute; right: 10px; bottom: 10px; padding: 6px 12px; border-radius: 999px;
  background: var(--glass); color: #fff; font-size: 13px;
}

.starpick { display: flex; gap: 2px; }
.starpick button { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--star-off); cursor: pointer; }
.starpick button.is-on { color: var(--star); }

.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 16px; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }

.btn--danger { color: var(--danger); }
.btn[disabled] { opacity: .5; pointer-events: none; }

.code-body { padding: 56px 20px calc(28px + var(--safe-b)); display: grid; gap: 14px; }
.code-body__title { margin: 0; font-size: 22px; font-weight: 700; }
.code-body__hint { margin: 0; font-size: 15px; color: var(--text-2); }
#addBtn { flex: 1 1 100%; }

</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1 class="top__title" id="title">Вишлист</h1>

    <div class="editbar" id="editbar" hidden>
      <button class="btn btn--main" type="button" id="addBtn">Добавить подарок</button>
      <label class="editbar__rate">Курс ₽ за €
        <input class="input" id="rateInput" type="number" inputmode="decimal" min="0" step="0.5">
      </label>
      <button class="btn btn--quiet editbar__exit" type="button" id="exitBtn">Выйти из правки</button>
    </div>

    <div class="sort" role="group" aria-label="Порядок">
      <button class="chip" type="button" data-sort="wish" aria-pressed="true">По желанию</button>
      <button class="chip" type="button" data-sort="cheap" aria-pressed="false">Дешевле</button>
      <button class="chip" type="button" data-sort="dear" aria-pressed="false">Дороже</button>
    </div>
  </header>

  <main class="grid" id="grid" aria-label="Подарки"></main>
  <p class="status" id="status">Загрузка…</p>
</div>

<div class="scrim" id="scrim" hidden></div>

<!-- Карточка подарка -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
  <button class="sheet__close" data-close type="button" aria-label="Закрыть">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div class="sheet__scroll"><div class="detail" id="detail"></div></div>
</div>

<!-- Ввод кода -->
<div class="sheet" id="codeSheet" role="dialog" aria-modal="true" aria-labelledby="codeTitle" hidden>
  <button class="sheet__close" data-close type="button" aria-label="Закрыть">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <form class="code-body" id="codeForm">
    <h2 class="code-body__title" id="codeTitle">Правка вишлиста</h2>
    <p class="code-body__hint">Введите секретный код.</p>
    <input class="input" id="codeInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn btn--main" type="submit" id="codeBtn">Войти</button>
  </form>
</div>

<!-- Форма подарка -->
<div class="sheet" id="form" role="dialog" aria-modal="true" aria-labelledby="formTitle" hidden>
  <div class="form__head">
    <button class="btn btn--quiet" type="button" data-close>Отмена</button>
    <h2 class="form__title" id="formTitle">Подарок</h2>
    <button class="btn btn--quiet form__done" type="button" id="formDone">Готово</button>
  </div>
  <div class="sheet__scroll">
    <div class="form__body">
      <button class="photo-pick" type="button" id="photoBtn"><img id="photoImg" alt="" hidden><span id="photoText">Выбрать фото</span></button>
      <input type="file" id="photoInput" accept="image/*" hidden>
      <label class="field"><span class="field__label">Название</span><input class="input" id="fTitle" type="text" autocomplete="off"></label>
      <label class="field"><span class="field__label">Цена в евро</span><input class="input" id="fPrice" type="number" inputmode="decimal" min="0" step="1"></label>
      <div class="field"><span class="field__label">Насколько хочу</span><div class="starpick" id="fStars"></div></div>
      <label class="field"><span class="field__label">Ссылка</span><input class="input" id="fUrl" type="url" inputmode="url" placeholder="https://" autocomplete="off"></label>
      <label class="check"><input type="checkbox" id="fTaken"><span>Занято</span></label>
      <button class="btn btn--quiet btn--danger" type="button" id="formDelete">Удалить подарок</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var API = 'https://wishlist.blackfeniks42.workers.dev/';
  var CODE_KEY = 'wishlist:code';
  var CACHE_KEY = 'wishlist:cache';
  var PHOTO_SIDE = 900, PHOTO_Q = 0.72;

  var $ = function (s) { return document.querySelector(s); };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function svg(markup, size) {
    var n = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    n.setAttribute('viewBox', '0 0 20 20');
    n.setAttribute('width', size);
    n.setAttribute('height', size);
    n.setAttribute('fill', 'none');
    n.setAttribute('aria-hidden', 'true');
    n.innerHTML = markup;
    return n;
  }

  var STAR = 'M10 1.9l2.42 4.9 5.41.79-3.92 3.82.93 5.39L10 14.25l-4.84 2.55.93-5.39L2.17 7.59l5.41-.79L10 1.9z';
  var LOCK = '<path d="M5.5 9V6.5a4.5 4.5 0 019 0V9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><rect x="3.8" y="9" width="12.4" height="8.2" rx="2.4" fill="currentColor"/>';

  function store(key, value) {
    try {
      if (value == null) localStorage.removeItem(key);
      else localStorage.setItem(key, value);
    } catch (e) {}
  }
  function read(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  function num(n) { return Math.round(n).toLocaleString('ru-RU'); }

  // ---------- связь с хранилищем ----------

  function api(path, body) {
    var opts = body ? { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=UTF-8' } } : { cache: 'no-store' };
    return fetch(API + path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok && !d.error) d.error = 'Ошибка ' + r.status;
        return d;
      });
    });
  }

  var data = null;

  function setData(d) {
    if (!d || !Array.isArray(d.items)) return;
    data = { rate: Number(d.rate) || 0, items: d.items };
    store(CACHE_KEY, JSON.stringify(data));
    render();
    if (current) {
      var fresh = findItem(current.id);
      if (fresh) { current = fresh; if (!sheet.hidden) buildDetail(fresh); }
    }
  }

  function findItem(id) {
    if (!data) return null;
    for (var i = 0; i < data.items.length; i++) if (data.items[i].id === id) return data.items[i];
    return null;
  }

  var lastLoad = 0;
  function load() {
    lastLoad = Date.now();
    api('data').then(function (d) {
      if (d.error) throw new Error(d.error);
      setData(d);
    }).catch(function () {
      if (!data) { $('#status').hidden = false; $('#status').textContent = 'Не получилось загрузить. Обновите страницу.'; }
    });
  }

  // ---------- цена, звёзды, фото ----------

  function priceRow(item) {
    var row = el('div', 'price');
    var eur = Number(item.price);
    if (!(eur > 0)) return row;
    row.appendChild(el('span', 'price__main', num(eur) + ' €'));
    if (data.rate > 0) {
      var v = eur * data.rate;
      var step = v >= 10000 ? 1000 : (v >= 1000 ? 100 : 10);
      row.appendChild(el('span', 'price__alt', '≈ ' + num(Math.round(v / step) * step) + ' ₽'));
    }
    return row;
  }

  function stars(v) {
    var box = el('div', 'stars');
    box.setAttribute('role', 'img');
    box.setAttribute('aria-label', 'Желание: ' + v + ' из 5');
    for (var i = 1; i <= 5; i++) {
      var on = i <= v;
      box.appendChild(svg('<path d="' + STAR + '" fill="' + (on ? 'var(--star)' : 'none') +
        '" stroke="' + (on ? 'var(--star)' : 'var(--star-off)') + '" stroke-width="1.4" stroke-linejoin="round"/>', 15));
    }
    return box;
  }

  function photoBox(item, cls) {
    var box = el('div', cls);
    if (item.photo) {
      var img = el('img');
      img.src = API + item.photo;
      img.alt = item.title;
      img.decoding = 'async';
      box.appendChild(img);
    }
    return box;
  }

  // ---------- список ----------

  var sort = 'wish';
  var editing = false;
  var grid = $('#grid');

  function sorted() {
    return data.items.map(function (item, index) { return { item: item, index: index }; })
      .sort(function (a, b) {
        if (!editing) {
          var ta = a.item.taken ? 1 : 0, tb = b.item.taken ? 1 : 0;
          if (ta !== tb) return ta - tb;
        }
        if (sort !== 'wish') {
          var pa = Number(a.item.price) || 0, pb = Number(b.item.price) || 0;
          if (pa && !pb) return -1;
          if (pb && !pa) return 1;
          if (pa !== pb) return sort === 'cheap' ? pa - pb : pb - pa;
        }
        if (a.item.wish !== b.item.wish) return b.item.wish - a.item.wish;
        return a.index - b.index;
      })
      .map(function (x) { return x.item; });
  }

  function card(item) {
    var c = el('button', 'card');
    c.type = 'button';
    if (item.taken) {
      c.classList.add('is-taken');
      var badge = el('span', 'badge');
      badge.appendChild(svg(LOCK, 13));
      badge.appendChild(el('span', null, 'Занято'));
      c.appendChild(badge);
    }
    c.appendChild(photoBox(item, 'card__photo'));
    c.appendChild(el('span', 'card__title', item.title || 'Без названия'));
    c.appendChild(priceRow(item));
    c.appendChild(stars(item.wish));
    c.addEventListener('click', function () {
      if (editing) openForm(item); else openItem(item);
    });
    return c;
  }

  function render() {
    if (!data) return;
    grid.textContent = '';
    sorted().forEach(function (item) { grid.appendChild(card(item)); });
    var empty = data.items.length === 0;
    grid.hidden = empty;
    $('#status').hidden = !empty;
    $('#status').textContent = editing ? 'Пока пусто. Нажмите «Добавить подарок».' : 'Здесь пока пусто';
    if (editing && document.activeElement !== $('#rateInput')) $('#rateInput').value = data.rate || '';
  }

  Array.prototype.forEach.call(document.querySelectorAll('.sort .chip'), function (b) {
    b.addEventListener('click', function () {
      sort = b.getAttribute('data-sort');
      Array.prototype.forEach.call(document.querySelectorAll('.sort .chip'), function (x) {
        x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
      });
      render();
    });
  });

  // ---------- панели поверх страницы ----------

  var scrim = $('#scrim');
  var openPanel = null;
  var pushed = false;
  var hideTimer = 0;

  function showPanel(panel) {
    clearTimeout(hideTimer);
    if (openPanel && openPanel !== panel) { openPanel.hidden = true; openPanel.classList.remove('is-open'); }
    openPanel = panel;
    if (!pushed) { history.pushState({ panel: 1 }, ''); pushed = true; }
    document.body.classList.add('is-locked');
    scrim.hidden = false;
    panel.hidden = false;
    panel.style.transform = '';
    var scroller = panel.querySelector('.sheet__scroll');
    if (scroller) scroller.scrollTop = 0;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        scrim.classList.add('is-open');
        panel.classList.add('is-open');
      });
    });
  }

  function closePanel(fromHistory) {
    if (!openPanel) return;
    if (!fromHistory && pushed) { history.back(); return; }
    pushed = false;
    var panel = openPanel;
    openPanel = null;
    current = null;
    document.body.classList.remove('is-locked');
    panel.style.transform = '';
    scrim.style.opacity = '';
    panel.classList.remove('is-open');
    scrim.classList.remove('is-open');
    hideTimer = setTimeout(function () {
      panel.hidden = true;
      scrim.hidden = true;
    }, 320);
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function (b) {
    b.addEventListener('click', function () { closePanel(); });
  });
  scrim.addEventListener('click', function () { closePanel(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });
  window.addEventListener('popstate', function () { if (pushed) closePanel(true); });

  // ---------- карточка подарка ----------

  var sheet = $('#sheet');
  var detail = $('#detail');
  var current = null;
  var confirming = false;
  var mine = [];

  function buildDetail(item) {
    detail.textContent = '';
    detail.appendChild(photoBox(item, 'detail__photo'));

    var body = el('div', 'detail__body');
    var h = el('h2', 'detail__title', item.title || 'Без названия');
    h.id = 'detailTitle';
    body.appendChild(h);
    body.appendChild(priceRow(item));
    body.appendChild(stars(item.wish));

    var actions = el('div', 'actions');

    if (item.url) {
      var a = el('a', 'btn btn--soft', 'Открыть ссылку');
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      actions.appendChild(a);
    }

    if (item.taken) {
      var taken = el('div', 'taken');
      taken.appendChild(svg(LOCK, 16));
      taken.appendChild(el('span', null, mine.indexOf(item.id) >= 0 ? 'Вы дарите это. Спасибо!' : 'Этот подарок уже занят'));
      actions.appendChild(taken);
    } else if (confirming) {
      var yes = el('button', 'btn btn--main', 'Да, дарю');
      yes.type = 'button';
      yes.addEventListener('click', function () {
        yes.disabled = true;
        api('take', { id: item.id }).then(function (d) {
          if (d.error) throw new Error(d.error);
          confirming = false;
          mine.push(item.id);
          setData(d);
        }).catch(function () {
          yes.disabled = false;
          toast('Не получилось отметить, попробуйте ещё раз');
        });
      });
      var no = el('button', 'btn btn--quiet', 'Отмена');
      no.type = 'button';
      no.addEventListener('click', function () { confirming = false; buildDetail(item); });
      actions.appendChild(yes);
      actions.appendChild(no);
    } else {
      var g = el('button', 'btn btn--main', 'Я дарю это');
      g.type = 'button';
      g.addEventListener('click', function () { confirming = true; buildDetail(item); });
      actions.appendChild(g);
    }

    body.appendChild(actions);
    detail.appendChild(body);
  }

  function openItem(item) {
    current = item;
    confirming = false;
    buildDetail(item);
    showPanel(sheet);
  }

  // Свайп вниз закрывает панель на телефоне
  Array.prototype.forEach.call(document.querySelectorAll('.sheet'), function (panel) {
    var startY = 0, dy = 0, active = false;
    var scroller = panel.querySelector('.sheet__scroll');
    panel.addEventListener('touchstart', function (e) {
      var t = e.target;
      active = window.innerWidth < 760 && e.touches.length === 1 && (!scroller || scroller.scrollTop <= 0) &&
        !(t.closest && t.closest('input, textarea'));
      startY = active ? e.touches[0].clientY : 0;
      dy = 0;
    }, { passive: true });
    panel.addEventListener('touchmove', function (e) {
      if (!active) return;
      dy = e.touches[0].clientY - startY;
      if (dy <= 0) { dy = 0; panel.style.transform = ''; return; }
      if (e.cancelable) e.preventDefault();
      panel.style.transition = 'none';
      panel.style.transform = 'translateY(' + dy + 'px)';
      scrim.style.opacity = String(Math.max(0, 1 - dy / 400));
    }, { passive: false });
    panel.addEventListener('touchend', function () {
      if (!active) return;
      active = false;
      panel.style.transition = '';
      if (dy > 110) closePanel();
      else { panel.style.transform = ''; scrim.style.opacity = ''; }
    });
  });

  // ---------- вход в правку: 5 нажатий на заголовок ----------

  var taps = 0, tapTimer = 0;
  $('#title').addEventListener('click', function () {
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(function () { taps = 0; }, 2000);
    if (taps < 5) return;
    taps = 0;
    if (editing) return;
    var saved = read(CODE_KEY);
    if (saved) {
      api('login', { code: saved }).then(function (d) {
        if (d.ok) startEditing(saved); else { store(CODE_KEY, null); askCode(); }
      }).catch(function () { toast('Нет связи, попробуйте ещё раз'); });
    } else {
      askCode();
    }
  });

  var codeSheet = $('#codeSheet');
  function askCode() {
    $('#codeInput').value = '';
    showPanel(codeSheet);
    setTimeout(function () { $('#codeInput').focus(); }, 350);
  }

  $('#codeForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = $('#codeInput').value.trim();
    if (!code) return;
    var btn = $('#codeBtn');
    btn.disabled = true;
    api('login', { code: code }).then(function (d) {
      btn.disabled = false;
      if (!d.ok) { toast(d.error || 'Неверный код'); return; }
      store(CODE_KEY, code);
      closePanel();
      startEditing(code);
      if (d.created) toast('Код сохранён. Запомните его');
    }).catch(function () {
      btn.disabled = false;
      toast('Нет связи, попробуйте ещё раз');
    });
  });

  var code = null;
  function startEditing(c) {
    code = c;
    editing = true;
    $('#editbar').hidden = false;
    render();
  }

  $('#exitBtn').addEventListener('click', function () {
    editing = false;
    code = null;
    $('#editbar').hidden = true;
    render();
  });

  $('#rateInput').addEventListener('change', function () {
    var rate = parseFloat(String(this.value).replace(',', '.'));
    if (!(rate > 0)) { toast('Впишите курс числом'); return; }
    api('rate', { code: code, rate: rate }).then(function (d) {
      if (!d.ok) throw new Error(d.error);
      setData(d);
      toast('Курс сохранён');
    }).catch(function () { toast('Не получилось сохранить курс'); });
  });

  // ---------- форма подарка ----------

  var form = $('#form');
  var buf = null;
  var initialTaken = false;
  var fTitle = $('#fTitle'), fPrice = $('#fPrice'), fUrl = $('#fUrl'), fTaken = $('#fTaken');
  var photoBtn = $('#photoBtn'), photoImg = $('#photoImg'), photoText = $('#photoText');
  var starsBox = $('#fStars');

  for (var s = 1; s <= 5; s++) {
    (function (v) {
      var b = el('button');
      b.type = 'button';
      b.setAttribute('aria-label', v + ' из 5');
      b.innerHTML = '<svg width="26" height="26" viewBox="0 0 20 20" aria-hidden="true"><path d="' + STAR + '" fill="currentColor"/></svg>';
      b.addEventListener('click', function () { buf.wish = v; paintStars(); });
      starsBox.appendChild(b);
    })(s);
  }

  function paintStars() {
    Array.prototype.forEach.call(starsBox.children, function (b, i) {
      b.classList.toggle('is-on', i < buf.wish);
    });
  }

  function paintPhoto() {
    var src = buf.newPhoto || (buf.photo ? API + buf.photo : '');
    photoImg.hidden = !src;
    if (src) photoImg.src = src; else photoImg.removeAttribute('src');
    photoText.textContent = src ? 'Заменить фото' : 'Выбрать фото';
    photoBtn.classList.toggle('has-photo', !!src);
  }

  function openForm(item) {
    buf = item ? { id: item.id, title: item.title, price: item.price, wish: item.wish, url: item.url, photo: item.photo, taken: item.taken, newPhoto: '' }
               : { id: '', title: '', price: 0, wish: 3, url: '', photo: '', taken: false, newPhoto: '' };
    initialTaken = !!buf.taken;
    $('#formTitle').textContent = item ? 'Подарок' : 'Новый подарок';
    fTitle.value = buf.title;
    fPrice.value = buf.price > 0 ? buf.price : '';
    fUrl.value = buf.url;
    fTaken.checked = !!buf.taken;
    $('#formDelete').hidden = !item;
    $('#formDone').disabled = false;
    paintStars();
    paintPhoto();
    showPanel(form);
  }

  $('#addBtn').addEventListener('click', function () { openForm(null); });

  $('#formDone').addEventListener('click', function () {
    var title = fTitle.value.trim();
    if (!title) { toast('Впишите название'); fTitle.focus(); return; }
    var url = fUrl.value.trim();
    if (url && !/^[a-z][a-z0-9+.-]*:/i.test(url)) url = 'https://' + url;

    var item = {
      id: buf.id,
      title: title,
      price: parseFloat(String(fPrice.value).replace(',', '.')) || 0,
      wish: buf.wish,
      url: url
    };
    if (buf.newPhoto) item.photo = buf.newPhoto;
    if (fTaken.checked !== initialTaken) item.taken = fTaken.checked;

    var btn = $('#formDone');
    btn.disabled = true;
    btn.textContent = 'Сохраняю…';
    api('item', { code: code, item: item }).then(function (d) {
      btn.disabled = false;
      btn.textContent = 'Готово';
      if (!d.ok) throw new Error(d.error);
      setData(d);
      closePanel();
      toast('Сохранено');
    }).catch(function (err) {
      btn.disabled = false;
      btn.textContent = 'Готово';
      toast(err && err.message && err.message !== 'Failed to fetch' ? err.message : 'Не получилось сохранить');
    });
  });

  $('#formDelete').addEventListener('click', function () {
    if (!buf.id || !confirm('Удалить «' + (buf.title || 'подарок') + '»?')) return;
    api('delete', { code: code, id: buf.id }).then(function (d) {
      if (!d.ok) throw new Error(d.error);
      setData(d);
      closePanel();
      toast('Удалено');
    }).catch(function () { toast('Не получилось удалить'); });
  });

  photoBtn.addEventListener('click', function () { $('#photoInput').click(); });
  $('#photoInput').addEventListener('change', function () {
    var file = this.files && this.files[0];
    this.value = '';
    if (!file) return;
    photoText.textContent = 'Готовлю фото…';
    var objectUrl = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      URL.revokeObjectURL(objectUrl);
      var w = img.naturalWidth, h = img.naturalHeight;
      var k = Math.min(1, PHOTO_SIDE / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * k));
      c.height = Math.max(1, Math.round(h * k));
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      buf.newPhoto = c.toDataURL('image/jpeg', PHOTO_Q);
      paintPhoto();
    };
    img.onerror = function () {
      URL.revokeObjectURL(objectUrl);
      paintPhoto();
      toast('Не получилось открыть фото');
    };
    img.src = objectUrl;
  });

  // ---------- сообщение ----------

  var toastEl = $('#toast');
  var toastTimer = 0;
  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('is-on'); }, 2600);
  }

  // ---------- старт ----------

  try {
    var cached = JSON.parse(read(CACHE_KEY) || 'null');
    if (cached && Array.isArray(cached.items)) { data = cached; render(); }
  } catch (e) {}
  load();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && Date.now() - lastLoad > 20000) load();
  });
})();

</script>
</body>
</html>
