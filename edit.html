<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Редактор вишлиста</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<style>
/* ============================================================
   Вишлист — оформление. Тёмная тема включается сама по системе.
   ============================================================ */

:root {
  color-scheme: light dark;
  --bg: #F5F5F7;
  --card: #FFFFFF;
  --card-2: #F0F0F3;
  --sep: rgba(0, 0, 0, .10);
  --text: #1D1D1F;
  --text-2: #5C5C61;
  --text-3: #6E6E73;
  --accent: #0071E3;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(0, 113, 227, .10);
  --fill: #1D1D1F;
  --fill-ink: #FFFFFF;
  --star: #C68A22;
  --star-off: rgba(0, 0, 0, .16);
  --shadow-hover: 0 4px 16px rgba(0, 0, 0, .08);
  --shadow-pop: 0 20px 60px rgba(0, 0, 0, .22), 0 2px 8px rgba(0, 0, 0, .08);
  --scrim: rgba(0, 0, 0, .40);
  --glass: rgba(28, 28, 30, .88);
  --danger: #D93B30;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.32, .72, 0, 1);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1C1C1E;
    --card-2: #2C2C2E;
    --sep: rgba(255, 255, 255, .14);
    --text: #F5F5F7;
    --text-2: #A1A1A6;
    --text-3: #8E8E93;
    --accent: #2997FF;
    --accent-ink: #00204A;
    --accent-soft: rgba(41, 151, 255, .16);
    --fill: #F5F5F7;
    --fill-ink: #1D1D1F;
    --star: #EFB350;
    --star-off: rgba(255, 255, 255, .22);
    --shadow-hover: 0 4px 18px rgba(0, 0, 0, .6);
    --shadow-pop: 0 24px 64px rgba(0, 0, 0, .8);
    --scrim: rgba(0, 0, 0, .60);
    --glass: rgba(58, 58, 60, .88);
    --danger: #FF6B5E;
  }
}

/* ---------- Основа ---------- */

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
}
body.is-locked { overflow: hidden; }
img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 1160px;
  margin: 0 auto;
  padding: 0 max(16px, var(--safe-r)) calc(48px + var(--safe-b)) max(16px, var(--safe-l));
}
@media (min-width: 760px) {
  .wrap { padding-left: max(40px, var(--safe-l)); padding-right: max(40px, var(--safe-r)); }
}

/* ---------- Шапка и порядок ---------- */

.top { padding: calc(var(--safe-t) + 40px) 0 0; }
.top__title {
  margin: 0;
  font-size: clamp(32px, 8vw, 44px);
  line-height: 1.07;
  font-weight: 700;
  letter-spacing: -0.022em;
}

.sort { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.chip {
  min-height: 40px;
  padding: 0 16px;
  border: 0;
  border-radius: 999px;
  background: var(--card);
  color: var(--text-2);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background .2s var(--ease), color .2s var(--ease);
}
.chip[aria-pressed="true"] { background: var(--fill); color: var(--fill-ink); }

/* ---------- Сетка карточек ---------- */

.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding-top: 20px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; } }

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  width: 100%;
  padding: 12px 12px 16px;
  border: 0;
  border-radius: 18px;
  background: var(--card);
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform .3s var(--ease), box-shadow .2s var(--ease);
}
.card:active { transform: scale(.97); transition-duration: .12s; }
@media (hover: hover) { .card:hover { box-shadow: var(--shadow-hover); } }

.card__photo {
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: 12px;
  overflow: hidden;
  background: var(--card-2);
}
.card__photo img { width: 100%; height: 100%; object-fit: cover; }

.card__title {
  display: -webkit-box;
  margin-top: 14px;
  font-size: 18px;
  line-height: 1.25;
  font-weight: 600;
  letter-spacing: -0.014em;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.price:empty { display: none; }
.price__main { font-size: 16px; font-weight: 600; }
.price__alt { font-size: 14px; color: var(--text-3); }

.stars { display: inline-flex; gap: 2px; margin-top: 8px; }
.stars svg { width: 14px; height: 14px; display: block; }

.badge {
  position: absolute;
  top: 22px; left: 22px;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px 6px 9px;
  border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  color: #FFFFFF;
  font-size: 12.5px;
  font-weight: 600;
}
.card.is-taken { opacity: .55; }
.card.is-taken .card__photo img { filter: grayscale(1); }

.empty { padding: 72px 0; text-align: center; color: var(--text-3); font-size: 17px; }

/* ---------- Панель поверх страницы ---------- */

.scrim {
  position: fixed; inset: 0; z-index: 60;
  background: var(--scrim);
  opacity: 0;
  transition: opacity .2s var(--ease);
}
.scrim.is-open { opacity: 1; }

.sheet {
  position: fixed;
  z-index: 61;
  left: 0; right: 0; bottom: 0;
  max-height: calc(100% - max(24px, var(--safe-t)));
  display: flex;
  flex-direction: column;
  background: var(--card);
  border-radius: 22px 22px 0 0;
  box-shadow: var(--shadow-pop);
  overflow: hidden;
  transform: translateY(100%);
  transition: transform .32s var(--ease);
}
.sheet.is-open { transform: translateY(0); }

@media (min-width: 760px) {
  .sheet {
    left: 50%; right: auto; top: 50%; bottom: auto;
    width: min(560px, calc(100vw - 64px));
    max-height: calc(100% - 64px);
    border-radius: 22px;
    opacity: 0;
    transform: translate(-50%, -46%) scale(.97);
    transition: transform .26s var(--ease), opacity .19s var(--ease);
  }
  .sheet.is-open { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

.sheet__scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

.sheet__close {
  position: absolute; top: 14px; right: 14px; z-index: 5;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border: 0; border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  color: #FFFFFF;
  cursor: pointer;
}
.sheet__close::after { content: ""; position: absolute; inset: -6px; }

.detail__photo { aspect-ratio: 4 / 3; background: var(--card-2); }
.detail__photo:empty { aspect-ratio: auto; height: 64px; background: none; }
.detail__photo img { width: 100%; height: 100%; object-fit: cover; }

.detail__body { padding: 22px 20px calc(28px + var(--safe-b)); }
@media (min-width: 760px) { .detail__body { padding: 24px 28px 30px; } }

.detail__title {
  margin: 0;
  font-size: clamp(24px, 6vw, 30px);
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.detail__body .price { margin-top: 10px; }
.detail__body .price__main { font-size: 20px; }
.detail__body .price__alt { font-size: 16px; }
.detail__body .stars { margin-top: 10px; }
.detail__body .stars svg { width: 17px; height: 17px; }

.actions { display: grid; gap: 10px; margin-top: 26px; }

/* ---------- Кнопки ---------- */

.btn {
  min-height: 50px;
  padding: 0 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 999px;
  background: var(--card-2);
  color: var(--text);
  font-size: 16px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: transform .12s var(--ease), opacity .2s var(--ease);
}
.btn:active { transform: scale(.98); }
@media (hover: hover) { .btn:hover { opacity: .85; } }
.btn--main { background: var(--accent); color: var(--accent-ink); }
.btn--soft { background: var(--accent-soft); color: var(--accent); }
.btn--quiet { background: none; color: var(--text-2); font-weight: 500; min-height: 44px; }

.taken {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px;
  padding: 0 16px;
  border-radius: 999px;
  background: var(--card-2);
  color: var(--text-2);
  font-size: 15px;
  font-weight: 500;
}

/* ---------- Сообщение ---------- */

.toast {
  position: fixed; left: 50%; bottom: calc(28px + var(--safe-b)); z-index: 90;
  max-width: calc(100vw - 32px);
  padding: 12px 20px;
  border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  color: #FFFFFF;
  font-size: 15px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 20px);
  transition: opacity .19s var(--ease), transform .19s var(--ease);
}
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .001ms !important; animation-duration: .001ms !important; }
}
/* ============================================================
   Редактор — оформление. Цвета берутся из style.css.
   ============================================================ */

.ed { padding-bottom: calc(110px + var(--safe-b)); max-width: 640px; }

.ed-add { width: 100%; margin-top: 22px; }

.ed-list { list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.ed-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 14px 8px 8px;
  border: 0;
  border-radius: 14px;
  background: var(--card);
  text-align: left;
  cursor: pointer;
}
.ed-item__img { flex: 0 0 auto; width: 64px; height: 48px; border-radius: 9px; object-fit: cover; background: var(--card-2); }
.ed-item__title { flex: 1 1 auto; min-width: 0; font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-item__mark { flex: 0 0 auto; font-size: 13px; color: var(--text-3); }

.ed-settings { margin-top: 40px; padding: 18px; border-radius: 18px; background: var(--card); display: grid; gap: 14px; }
.ed-settings__title { margin: 0; font-size: 18px; font-weight: 600; }

.field { display: grid; gap: 6px; }
.field__label { font-size: 13px; font-weight: 500; color: var(--text-2); }
.input {
  width: 100%;
  min-height: 46px;
  padding: 10px 14px;
  border: 1px solid var(--sep);
  border-radius: 12px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
  font-size: 16px;
}
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.ed-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  padding: 10px max(16px, var(--safe-r)) calc(10px + var(--safe-b)) max(16px, var(--safe-l));
  background: var(--bg);
  border-top: 1px solid var(--sep);
}
.ed-bar__inner { max-width: 640px; margin: 0 auto; }
.ed-bar .btn { width: 100%; }

/* Форма подарка */
.ed-form__head {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 6px 8px;
  border-bottom: 1px solid var(--sep);
}
.ed-form__head .btn { justify-self: start; padding: 0 12px; }
.ed-form__head .ed-form__done { justify-self: end; color: var(--accent); font-weight: 600; }
.ed-form__title { margin: 0; font-size: 17px; font-weight: 600; }
.ed-form__body { padding: 18px 20px calc(28px + var(--safe-b)); display: grid; gap: 16px; }

.ed-photo {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1.5px dashed var(--sep);
  border-radius: 14px;
  background: var(--bg);
  color: var(--accent);
  font-size: 16px;
  font-weight: 600;
  overflow: hidden;
  cursor: pointer;
}
.ed-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ed-photo.has-photo { border-style: solid; }
.ed-photo.has-photo span {
  position: absolute; right: 10px; bottom: 10px;
  padding: 6px 12px; border-radius: 999px;
  background: var(--glass); color: #fff; font-size: 13px;
}

.ed-stars { display: flex; gap: 2px; }
.ed-stars button { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--star-off); cursor: pointer; }
.ed-stars button.is-on { color: var(--star); }

.ed-check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 16px; cursor: pointer; }
.ed-check input { width: 22px; height: 22px; accent-color: var(--accent); }

.ed-delete { color: var(--danger); }

/* сообщение над нижней кнопкой */
.toast { bottom: calc(92px + var(--safe-b)); }
</style>
</head>
<body>

<div class="wrap ed">
  <header class="top">
    <h1 class="top__title">Редактор</h1>
  </header>

  <button class="btn btn--main ed-add" type="button" id="addBtn">Добавить подарок</button>

  <ul class="ed-list" id="list"></ul>

  <section class="ed-settings">
    <h2 class="ed-settings__title">Настройки</h2>
    <label class="field">
      <span class="field__label">Рублей в одном евро</span>
      <input class="input" id="rate" type="number" inputmode="decimal" min="0" step="0.5">
    </label>
    <label class="field">
      <span class="field__label">Ссылка на таблицу (для кнопки «Я дарю это»)</span>
      <input class="input" id="sheetUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    </label>
    <button class="btn btn--soft" type="button" id="copyCode">Скопировать код для таблицы</button>
  </section>
</div>

<div class="ed-bar">
  <div class="ed-bar__inner">
    <button class="btn btn--main" type="button" id="saveBtn">Сохранить файл</button>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet ed-form" id="form" role="dialog" aria-modal="true" aria-labelledby="formTitle" hidden>
  <div class="ed-form__head">
    <button class="btn btn--quiet" type="button" id="formCancel">Отмена</button>
    <h2 class="ed-form__title" id="formTitle">Подарок</h2>
    <button class="btn btn--quiet ed-form__done" type="button" id="formDone">Готово</button>
  </div>
  <div class="sheet__scroll">
    <div class="ed-form__body">
      <button class="ed-photo" type="button" id="photoBtn">
        <img id="photoImg" alt="" hidden>
        <span id="photoText">Выбрать фото</span>
      </button>
      <input type="file" id="photoInput" accept="image/*" hidden>

      <label class="field">
        <span class="field__label">Название</span>
        <input class="input" id="fTitle" type="text" autocomplete="off">
      </label>

      <label class="field">
        <span class="field__label">Цена в евро</span>
        <input class="input" id="fPrice" type="number" inputmode="decimal" min="0" step="1">
      </label>

      <div class="field">
        <span class="field__label">Насколько хочу</span>
        <div class="ed-stars" id="fStars"></div>
      </div>

      <label class="field">
        <span class="field__label">Ссылка</span>
        <input class="input" id="fUrl" type="url" inputmode="url" placeholder="https://" autocomplete="off">
      </label>

      <label class="ed-check">
        <input type="checkbox" id="fTaken">
        <span>Занято</span>
      </label>

      <button class="btn btn--quiet ed-delete" type="button" id="formDelete">Удалить подарок</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>document.write('<script src="wishlist.js?v=' + Date.now() + '"><\/script>');</script>
<script>
/* ============================================================
   Общие мелочи для сайта и редактора.
   ============================================================ */
(function () {
  'use strict';

  // Приводит данные к одному виду. Понимает и старый формат файла.
  function normalize(src) {
    var d = { updated: 0, eurToRub: 95, sheetUrl: '', items: [] };
    if (!src || typeof src !== 'object') return d;
    d.updated = Number(src.updated) || 0;
    if (Number(src.eurToRub) > 0) d.eurToRub = Number(src.eurToRub);
    if (typeof src.sheetUrl === 'string') d.sheetUrl = src.sheetUrl.trim();

    var list = Array.isArray(src.items) ? src.items : [];
    list.forEach(function (i) {
      if (!i || typeof i !== 'object' || i.bought) return;
      var photo = typeof i.photo === 'string' ? i.photo : '';
      if (!photo && Array.isArray(i.photos) && i.photos[0]) photo = i.photos[0].full || i.photos[0].thumb || '';
      var url = typeof i.url === 'string' ? i.url : '';
      if (!url && Array.isArray(i.links) && i.links[0]) url = i.links[0].url || '';
      d.items.push({
        id: String(i.id || ''),
        title: String(i.title || ''),
        priceEur: Number(i.priceEur) > 0 ? Number(i.priceEur) : 0,
        wish: Math.min(5, Math.max(0, Math.round(Number(i.wish) || 0))),
        url: String(url).trim(),
        photo: String(photo),
        taken: !!(i.taken || i.reserved)
      });
    });
    return d;
  }

  // Запрос к Гугл-таблице. Работает через тег <script>, поэтому браузер не блокирует.
  function askSheet(sheetUrl, params, done) {
    if (!sheetUrl) { done(null); return; }
    var name = 'wl_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    var tag = document.createElement('script');
    var finished = false;
    var timer = setTimeout(function () { finish(null); }, 12000);

    function finish(result) {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      window[name] = function () {};
      if (tag.parentNode) tag.parentNode.removeChild(tag);
      done(Array.isArray(result) ? result.map(String) : null);
    }

    window[name] = finish;
    var q = [];
    Object.keys(params || {}).forEach(function (k) {
      q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
    });
    q.push('callback=' + name);
    q.push('t=' + Date.now());
    tag.src = sheetUrl + (sheetUrl.indexOf('?') >= 0 ? '&' : '?') + q.join('&');
    tag.onerror = function () { finish(null); };
    document.head.appendChild(tag);
  }

  window.WL = { normalize: normalize, askSheet: askSheet };
})();

/* ============================================================
   Редактор вишлиста. Работает целиком в браузере.
   ============================================================ */
(function () {
  'use strict';

  var $ = function (s) { return document.querySelector(s); };
  var DRAFT_KEY = 'wishlist:draft3';
  var PHOTO_SIDE = 900, PHOTO_Q = 0.72;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // ---------- данные: берём то, что новее — файл сайта или черновик ----------

  var data = WL.normalize(window.WISHLIST);
  try {
    var raw = localStorage.getItem(DRAFT_KEY);
    if (raw) {
      var draft = WL.normalize(JSON.parse(raw));
      if (draft.updated > data.updated) data = draft;
    }
  } catch (e) { /* черновика нет */ }

  var draftTimer = 0;
  function changed() {
    data.updated = Date.now();
    clearTimeout(draftTimer);
    draftTimer = setTimeout(function () {
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); }
      catch (e) { toast('Черновик не поместился в память. Сохраните файл.'); }
    }, 300);
  }

  var TRANSLIT = {
    'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y',
    'к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f',
    'х':'h','ц':'c','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'
  };

  function makeId(title) {
    var base = String(title).toLowerCase().split('').map(function (c) {
      if (TRANSLIT[c] != null) return TRANSLIT[c];
      return /[a-z0-9]/.test(c) ? c : '-';
    }).join('').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'podarok';
    var used = {};
    data.items.forEach(function (i) { used[i.id] = true; });
    if (!used[base]) return base;
    var n = 2;
    while (used[base + '-' + n]) n++;
    return base + '-' + n;
  }

  // ---------- список ----------

  var list = $('#list');

  function renderList() {
    list.textContent = '';
    data.items.forEach(function (item) {
      var li = el('li');
      var b = el('button', 'ed-item');
      b.type = 'button';
      var img = el('img', 'ed-item__img');
      img.alt = '';
      if (item.photo) img.src = item.photo;
      b.appendChild(img);
      b.appendChild(el('span', 'ed-item__title', item.title || 'Без названия'));
      if (item.taken) b.appendChild(el('span', 'ed-item__mark', 'занято'));
      b.addEventListener('click', function () { openForm(item); });
      li.appendChild(b);
      list.appendChild(li);
    });
  }

  // ---------- настройки ----------

  var rateIn = $('#rate');
  var sheetIn = $('#sheetUrl');
  rateIn.value = data.eurToRub;
  sheetIn.value = data.sheetUrl;
  rateIn.addEventListener('input', function () {
    var n = parseFloat(String(rateIn.value).replace(',', '.'));
    data.eurToRub = n > 0 ? n : 0;
    changed();
  });
  sheetIn.addEventListener('input', function () {
    data.sheetUrl = sheetIn.value.trim();
    changed();
  });

  var SHEET_CODE = [
    '/** @OnlyCurrentDoc */',
    'function doGet(e) {',
    '  var p = e.parameter;',
    '  var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];',
    '  var lock = LockService.getScriptLock();',
    '  lock.waitLock(10000);',
    '  if (sheet.getLastRow() === 0) sheet.appendRow([\'Подарок\', \'Код\', \'Когда\']);',
    '  var ids = sheet.getDataRange().getValues()',
    '    .map(function (r) { return String(r[1] || \'\').trim(); })',
    '    .filter(function (id) { return id; });',
    '  if (p.take && ids.indexOf(p.take) < 0) {',
    '    var row = sheet.getLastRow() + 1;',
    '    sheet.getRange(row, 1, 1, 2).setNumberFormat(\'@\').setValues([[p.title || \'\', p.take]]);',
    '    sheet.getRange(row, 3).setValue(new Date());',
    '    ids.push(p.take);',
    '  }',
    '  lock.releaseLock();',
    '  var out = JSON.stringify(ids);',
    '  if (/^[\\w$]+$/.test(p.callback || \'\')) {',
    '    return ContentService.createTextOutput(p.callback + \'(\' + out + \')\')',
    '      .setMimeType(ContentService.MimeType.JAVASCRIPT);',
    '  }',
    '  return ContentService.createTextOutput(out).setMimeType(ContentService.MimeType.JSON);',
    '}'
  ].join('\n');

  $('#copyCode').addEventListener('click', function () {
    copyText(SHEET_CODE, function (ok) {
      toast(ok ? 'Код скопирован' : 'Не получилось скопировать');
    });
  });

  function copyText(text, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { fallback(); });
    } else {
      fallback();
    }
    function fallback() {
      var ta = el('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      done(ok);
    }
  }

  // ---------- форма подарка ----------

  var scrim = $('#scrim');
  var form = $('#form');
  var editing = null;
  var buf = null;

  var fTitle = $('#fTitle'), fPrice = $('#fPrice'), fUrl = $('#fUrl'), fTaken = $('#fTaken');
  var photoBtn = $('#photoBtn'), photoImg = $('#photoImg'), photoText = $('#photoText');
  var starsBox = $('#fStars');

  var STAR = '<svg width="26" height="26" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.9l2.42 4.9 5.41.79-3.92 3.82.93 5.39L10 14.25l-4.84 2.55.93-5.39L2.17 7.59l5.41-.79L10 1.9z" fill="currentColor"/></svg>';
  for (var s = 1; s <= 5; s++) {
    (function (v) {
      var b = el('button');
      b.type = 'button';
      b.setAttribute('aria-label', v + ' из 5');
      b.innerHTML = STAR;
      b.addEventListener('click', function () { buf.wish = v; paintStars(); });
      starsBox.appendChild(b);
    })(s);
  }

  function paintStars() {
    Array.prototype.forEach.call(starsBox.children, function (b, i) {
      b.classList.toggle('is-on', i < buf.wish);
      b.setAttribute('aria-pressed', i < buf.wish ? 'true' : 'false');
    });
  }

  function paintPhoto() {
    photoImg.hidden = !buf.photo;
    if (buf.photo) photoImg.src = buf.photo; else photoImg.removeAttribute('src');
    photoText.textContent = buf.photo ? 'Заменить фото' : 'Выбрать фото';
    photoBtn.classList.toggle('has-photo', !!buf.photo);
  }

  function openForm(item) {
    editing = item || null;
    buf = item ? JSON.parse(JSON.stringify(item))
               : { id: '', title: '', priceEur: 0, wish: 3, url: '', photo: '', taken: false };
    $('#formTitle').textContent = item ? 'Подарок' : 'Новый подарок';
    fTitle.value = buf.title;
    fPrice.value = buf.priceEur > 0 ? buf.priceEur : '';
    fUrl.value = buf.url;
    fTaken.checked = buf.taken;
    $('#formDelete').hidden = !item;
    paintStars();
    paintPhoto();

    document.body.classList.add('is-locked');
    scrim.hidden = false;
    form.hidden = false;
    form.querySelector('.sheet__scroll').scrollTop = 0;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        scrim.classList.add('is-open');
        form.classList.add('is-open');
      });
    });
  }

  function closeForm() {
    document.body.classList.remove('is-locked');
    form.classList.remove('is-open');
    scrim.classList.remove('is-open');
    setTimeout(function () { form.hidden = true; scrim.hidden = true; }, 320);
  }

  $('#addBtn').addEventListener('click', function () { openForm(null); });
  $('#formCancel').addEventListener('click', closeForm);
  scrim.addEventListener('click', closeForm);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !form.hidden) closeForm(); });

  $('#formDone').addEventListener('click', function () {
    var title = fTitle.value.trim();
    if (!title) { toast('Впишите название'); fTitle.focus(); return; }
    var price = parseFloat(String(fPrice.value).replace(',', '.'));
    var url = fUrl.value.trim();
    if (url && !/^[a-z][a-z0-9+.-]*:/i.test(url)) url = 'https://' + url;

    buf.title = title;
    buf.priceEur = price > 0 ? price : 0;
    buf.url = url;
    buf.taken = fTaken.checked;

    if (editing) {
      data.items[data.items.indexOf(editing)] = buf;
    } else {
      buf.id = makeId(title);
      data.items.unshift(buf);
    }
    changed();
    renderList();
    closeForm();
    toast(editing ? 'Сохранено' : 'Добавлено');
  });

  $('#formDelete').addEventListener('click', function () {
    if (!editing || !confirm('Удалить «' + (editing.title || 'подарок') + '»?')) return;
    data.items = data.items.filter(function (i) { return i !== editing; });
    changed();
    renderList();
    closeForm();
    toast('Удалено');
  });

  // ---------- фото: уменьшаем, чтобы сайт открывался быстро ----------

  photoBtn.addEventListener('click', function () { $('#photoInput').click(); });
  $('#photoInput').addEventListener('change', function () {
    var file = this.files && this.files[0];
    this.value = '';
    if (!file) return;
    photoText.textContent = 'Готовлю фото…';
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      URL.revokeObjectURL(url);
      var w = img.naturalWidth, h = img.naturalHeight;
      var k = Math.min(1, PHOTO_SIDE / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * k));
      c.height = Math.max(1, Math.round(h * k));
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      buf.photo = c.toDataURL('image/jpeg', PHOTO_Q);
      paintPhoto();
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      paintPhoto();
      toast('Не получилось открыть фото');
    };
    img.src = url;
  });

  // ---------- сохранить файл ----------

  $('#saveBtn').addEventListener('click', function () {
    data.updated = Date.now();
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); } catch (e) {}
    var out = {
      updated: data.updated,
      eurToRub: data.eurToRub,
      sheetUrl: data.sheetUrl,
      items: data.items.map(function (i) {
        var o = { id: i.id, title: i.title, wish: i.wish };
        if (i.priceEur > 0) o.priceEur = i.priceEur;
        if (i.url) o.url = i.url;
        if (i.taken) o.taken = true;
        if (i.photo) o.photo = i.photo;
        return o;
      })
    };
    var text = '// Данные вишлиста. Меняются через edit.html.\nwindow.WISHLIST = ' + JSON.stringify(out, null, 2) + ';\n';
    var blob = new Blob([text], { type: 'text/javascript;charset=utf-8' });
    var href = URL.createObjectURL(blob);
    var a = el('a');
    a.href = href;
    a.download = 'wishlist.js';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(href); }, 4000);
    toast('Файл wishlist.js скачан');
  });

  // ---------- сообщение ----------

  var toastEl = $('#toast');
  var toastTimer = 0;
  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('is-on'); }, 2400);
  }

  renderList();
})();
</script>
</body>
</html>
